[workspace]
name = "histopresto"
authors = ["Alexander Held"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
nodejs = ">=22"
c-compiler = "*"
cmake = "*"
ninja = "*"
pytest = "*"

[pypi-dependencies]
histopresto = { path = "python", editable = true }
pyhf = ">=0.8, <0.9"
iminuit = ">=2.33.0, <3"

[tasks]
npm-install = { cmd = "npm install", inputs = ["package.json", "js/*/package.json"], outputs = ["node_modules/.package-lock.json"] }
test-js = { cmd = "npm test", depends-on = ["npm-install"] }
test-py = { cmd = "pytest tests/python tests/cross", depends-on = ["npm-install"] }
test = { depends-on = ["test-js", "test-py"] }
build-app = { cmd = "npm run build", depends-on = ["npm-install"] }
serve = { cmd = "npm run serve --workspace js/app", depends-on = ["npm-install"] }
reference = "python tests/reference/export_reference.py"
logo = "python scripts/make_logo.py -o assets/logo.svg && python scripts/make_logo.py --dark -o assets/logo-dark.svg && python scripts/make_logo.py --mark-only -o assets/icon.svg && python scripts/make_logo.py --mark-only --dark -o assets/icon-dark.svg"

# pyhf with the purefunc modifier of https://github.com/scikit-hep/pyhf/pull/2717 (needs jax and sympy),
# only used to export reference numbers for workspaces with expressions
[feature.purefunc-ref.dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"

[feature.purefunc-ref.pypi-dependencies]
pyhf = { git = "https://github.com/specktakel/pyhf", rev = "4445deda7c884cc3bb6adfa9286168afb2e5acf8" }
jax = "*"
sympy = ">=1.11"
iminuit = ">=2.33.0, <3"

[feature.purefunc-ref.tasks]
reference-purefunc = "python tests/reference/export_reference.py purefunc purefunc_mixed"

[environments]
purefunc-ref = { features = ["purefunc-ref"], no-default-feature = true }
